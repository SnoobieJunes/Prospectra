# 2026-07-13 (P2): CI across all three supported OSes. Why Windows is first in the matrix: the
# project's testers run Windows only, and the maintainer develops on macOS — so "it launches on
# Windows" must be proven by a real Windows run, not inferred. The `gui-launch` step starts the
# actual app with its native platform plugin (no offscreen override) and asserts a clean exit;
# `pytest` runs offscreen (tests/conftest.py) so it is deterministic everywhere.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # PySide6 needs these even for the offscreen plugin; xvfb gives the GUI-launch step a real
      # X display (Windows and macOS runners have a native display session; Linux runners do not).
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1

      - name: Install project
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy, strict in core)
        run: uv run mypy prospectra

      - name: Architecture contract (core stays Qt-free)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -q

      # The headless engine must work with no display at all.
      - name: Headless engine (CLI)
        run: uv run prospectra generate-example

      # The real proof for Windows testers: launch the actual GUI with the native platform plugin
      # (windows / cocoa). --smoke opens the main window, then auto-quits with exit code 0.
      - name: GUI launch (native platform)
        if: runner.os != 'Linux'
        run: uv run prospectra --smoke

      # Same launch on Linux, against a real X display supplied by Xvfb.
      - name: GUI launch (Xvfb display)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run prospectra --smoke

  # 2026-07-14 (P6): packaging. A build that succeeds proves nothing — the first macOS bundle built
  # cleanly and had silently dropped every entry-point plugin (PyInstaller ships no .dist-info, so
  # importlib.metadata found nothing). So the job does not stop at "built": it LAUNCHES the bundled
  # binary and asserts the packaged app still sees its plugins and can run the engine.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1

      - name: Install project
        run: uv sync --frozen

      - name: Build the app (PyInstaller)
        run: uv run pyinstaller packaging/prospectra.spec --noconfirm

      # The bundled binary, not the dev install: does it still know its connectors and plugins?
      - name: Packaged app keeps its plugins (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/Prospectra.app/Contents/MacOS/Prospectra connectors | tee out.txt
          grep -q "Jira (issues)" out.txt
          ./dist/Prospectra.app/Contents/MacOS/Prospectra --smoke

      - name: Packaged app keeps its plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/Prospectra/Prospectra connectors | tee out.txt
          grep -q "Jira (issues)" out.txt
          xvfb-run -a ./dist/Prospectra/Prospectra --smoke

      - name: Packaged app keeps its plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\Prospectra\Prospectra.exe connectors | Tee-Object -FilePath out.txt
          if (-not (Select-String -Path out.txt -Pattern "Jira \(issues\)" -Quiet)) {
            throw "The packaged app lost its entry-point plugins"
          }
          .\dist\Prospectra\Prospectra.exe --smoke

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: prospectra-${{ matrix.os }}
          path: dist/
          retention-days: 14
