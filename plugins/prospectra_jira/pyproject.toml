# 2026-07-14 (P6): The reference plugin. It lives in its own distribution with its own pyproject —
# exactly what a third party would write — and plugs in through the `prospectra.connectors`
# entry-point group. Nothing in Prospectra's code knows this package exists.

[project]
name = "prospectra-jira"
version = "0.1.0"
description = "Jira connector for Prospectra — the reference implementation of the plugin API."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []  # it uses Prospectra's own REST tier; no extra dependency of its own

# This is the whole registration mechanism: name -> Connector subclass.
[project.entry-points."prospectra.connectors"]
jira = "prospectra_jira.connector:JiraConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospectra_jira"]
